<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Buckshot Roulette</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Buckshot Roulette - A thrilling game of chance and strategy. Take turns, choose wisely, survive the round!" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles/index.css" />
</head>

<body>
    <!-- App Mount Point -->
    <div id="app">
        <!-- Start Screen -->
        <start-screen v-if="currentScreen === 'start'" v-model="playerName" @start-game="onStartGame"
            :class="{ hidden: isStartLeaving }"></start-screen>

        <!-- Replay / Game Over Screen -->
        <replay-screen v-if="currentScreen === 'replay'" :result="gameResult" @play-again="onReplay"
            @quit="onQuit"></replay-screen>

        <!-- Phaser Container -->
        <div id="phaser-container" v-show="currentScreen === 'game' || currentScreen === 'replay'"></div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Main Entry -->
    <script type="module" src="main.js"></script>

    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";

  // https://firebase.google.com/docs/web/setup#available-libraries

    authDomain: "bang-or-blank.firebaseapp.com",
    projectId: "bang-or-blank",
    storageBucket: "bang-or-blank.firebasestorage.app",
    messagingSenderId: "24686479967",
    appId: "1:24686479967:web:2ac96825a9ce06a75fa9ea",
    measurementId: "G-X712GD0M7P"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>
</body>

</html>
