<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buckshot Roulette</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Start Screen - Switch Theme -->
    <div id="start-screen">
        <!-- Top Bar -->
        <div class="switch-header">
            <div class="user-profile">
                <div class="user-icon">
                    <span>M</span>
                </div>
                <div class="user-name">Player 1</div>
            </div>
            <div class="system-time">12:00 PM</div>
        </div>

        <!-- Main Content -->
        <div class="switch-content">
            <div class="side-menu">
                <div class="menu-item active">Games</div>
                <div class="menu-item">News</div>
                <div class="menu-item">Shop</div>
                <div class="menu-item">Album</div>
                <div class="menu-item">Settings</div>
            </div>

            <div class="game-card-container">
                <div class="game-card">
                    <div class="card-image">
                        <div class="gun-icon">🔫</div>
                    </div>
                    <div class="card-title">Buckshot<br>Roulette</div>
                </div>
                
                <div class="start-interaction">
                     <p>Press A to Start</p>
                     <input type="text" id="player-name-input" placeholder="Enter Name" maxlength="10" autocomplete="off">
                     <button id="btn-start-game" class="switch-btn" disabled>Start</button>
                </div>
            </div>
        </div>
        
        <!-- Bottom Bar -->
        <div class="switch-footer">
            <div class="controller-icon">🎮</div>
            <div class="battery-icon">🔋 100%</div>
        </div>
    </div>

    <div id="game-container" style="display: none;">
      <!-- Header / Stats -->
      <header>
        <div class="round-indicator">Round <span id="round-count">1</span></div>
        <div style="font-weight:bold; color:#ffeb3b" id="turn-indicator">Your Turn</div>
        <!-- <div id="message-log"></div> Moved to separate overlay or just keep simple for now -->
      </header>
      <div style="text-align:center; padding:5px; background:rgba(0,0,0,0.2); color:white; font-size:0.9rem;" id="message-log">Welcome!</div>

      <!-- Dealer Zone (Top) -->
      <section id="dealer-zone" class="player-zone">
        <div class="avatar dealer-avatar">
          <div class="avatar-face">🤖</div>
        </div>
        <div class="health-bar" id="dealer-health">
          <!-- Hearts generated by JS -->
        </div>
        <div class="inventory" id="dealer-inventory">
          <!-- Items generated by JS -->
        </div>
      </section>

      <!-- Table Zone (Center) -->
      <section id="table-zone">
        <div class="shells-display" id="shells-display">
          <!-- Shells (Live/Blank) visual history or current load -->
        </div>

        <div class="active-item-area">
          <div id="current-gun" class="gun">🔫</div>
        </div>
      </section>

      <!-- Player Zone (Bottom) -->
      <section id="player-zone" class="player-zone">
        <div class="inventory" id="player-inventory">
          <!-- Items generated by JS -->
        </div>

        <div class="player-info">
          <div class="avatar player-avatar">
            <div class="avatar-face">🧑</div>
          </div>
          <div class="health-bar" id="player-health">
            <!-- Hearts generated by JS -->
          </div>
        </div>
      </section>

      <!-- Control Panel -->
      <div id="controls-overlay">
        <div class="action-buttons">
          <button id="btn-shoot-dealer" class="btn btn-blue">
            SHOOT DEALER
          </button>
          <button id="btn-shoot-self" class="btn btn-red">SHOOT SELF</button>
        </div>
        <div class="ammo-indicator">
          <div class="ammo-count">
            <span class="live-count">🔴 0</span>
            <span class="blank-count">🔵 0</span>
          </div>
          <div class="label">LOADED</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
