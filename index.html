<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Buckshot Roulette Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: 'Inter', sans-serif
    }
  </style>
</head>

<body>

  <!-- NINTENDO-STYLE START SCREEN -->
  <div id="start-screen">
    <div class="glass-card">
      <h1 class="game-title">Buckshot<br>Roulette</h1>
      <p class="game-subtitle">
        Take turns.<br>
        Choose wisely.<br>
        Survive the round!
      </p>

      <div class="input-group">
        <input type="text" id="player-name" class="name-input" placeholder="Enter Player Name" maxlength="12"
          autocomplete="off">
      </div>

      <button id="btn-start" class="start-btn" disabled>Start Game</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <script type="module" src="./main.js"></script>
</body>

</html>
